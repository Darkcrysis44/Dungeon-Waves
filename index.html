<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dungeon Waves</title>
<style>
:root{--bg:#14110f;--stone:#2a2623;--iron:#8a8f94;--ember:#d9822b;--bone:#d8cdb8;--hp:#a8322a;--st:#c9a23a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}

.bar{display:flex;gap:12px;flex-wrap:wrap;width:100%;max-width:960px;align-items:center}

.meter i{display:block;height:100%;width:100%}
#hp i{background:var(--hp)}#st i{background:var(--st)}
button{font:inherit;background:var(--stone);color:var(--bone);border:2px solid var(--iron);padding:8px 16px;cursor:pointer}
button.on{border-color:var(--ember);color:var(--ember)}

#ov{position:absolute;inset:0;background:rgba(10,8,6,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:12px}
#ov h1{margin:0;font-size:clamp(28px,6vw,48px);font-weight:normal;letter-spacing:.04em}
#ov p{margin:0;max-width:52ch;line-height:1.5;color:#b5ab98}
#leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;max-width:960px;width:100%}
#leg span.lock{opacity:.4}
#cards{position:absolute;inset:0;background:rgba(10,8,6,.92);flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
#cards h2{margin:0;font-weight:normal}#cards p{margin:0;color:#b5ab98;font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card{all:unset;box-sizing:border-box;display:block;width:214px;height:262px;cursor:pointer;perspective:1000px;animation:cardin .6s var(--ci) cubic-bezier(.2,1.2,.4,1) both;transition:transform .2s,filter .2s}
.card:hover{transform:translateY(-12px) scale(1.06);filter:drop-shadow(0 0 16px var(--rc))}
.card:focus-visible{outline:2px solid var(--ember)}
.ci{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flipc .85s var(--fd) both}
.cfront,.cback{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.cback{background:repeating-linear-gradient(45deg,#2a1a0a 0 9px,#3e2812 9px 18px);border:3px solid var(--rc);transform:rotateY(180deg)}
.cback::after{content:'';position:absolute;inset:34% 30%;border:3px solid var(--rc);border-radius:50%;opacity:.7}
.cfront{border:3px solid var(--rc);background:linear-gradient(170deg,#2a2018,#120d09 70%);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 12px;text-align:center;color:var(--bone)}
.cfront b{font-size:17px;letter-spacing:.03em;color:#fff}
.crar{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--rc);font-weight:bold}
.cico{display:flex;gap:4px;justify-content:center;min-height:36px;filter:drop-shadow(0 0 6px var(--rc))}
.ct{font-size:13px;line-height:1.35;color:#c8bca4}
.cr2 .cfront{box-shadow:inset 0 0 18px var(--rc)}
.cr3 .cfront::after,.cr4 .cfront::after,.cr5 .cfront::after,.cr6 .cfront::after,.cr7 .cfront::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:sheen 2.6s 1.6s infinite}
.cr4 .cfront,.cr5 .cfront,.cr6 .cfront,.cr7 .cfront{animation:cglow 1.8s 1.6s infinite}
.sp{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--rc);box-shadow:0 0 8px var(--rc);animation:spk 2.2s infinite;opacity:0}
.s1{left:14%;bottom:12%;animation-delay:1.7s}.s2{left:80%;bottom:20%;animation-delay:2.1s}.s3{left:40%;bottom:6%;animation-delay:2.5s}.s4{left:64%;bottom:10%;animation-delay:2.9s}
.card.pick{animation:pickc .6s forwards!important;z-index:5}.card.out{animation:outc .4s forwards!important}
#cards .row{gap:18px}.cp1{letter-spacing:.2em;text-transform:uppercase;color:#d9822b!important}
@keyframes cardin{0%{opacity:0;transform:translateY(120px) rotate(-10deg) scale(.6)}100%{opacity:1;transform:none}}
@keyframes flipc{0%{transform:rotateY(180deg)}100%{transform:rotateY(0)}}
@keyframes sheen{0%{left:-60%}60%,100%{left:140%}}
@keyframes cglow{0%,100%{box-shadow:0 0 10px var(--rc),inset 0 0 12px var(--rc)}50%{box-shadow:0 0 30px var(--rc),inset 0 0 24px var(--rc)}}
@keyframes spk{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
@keyframes pickc{0%{transform:scale(1)}40%{transform:translateY(-20px) scale(1.2);filter:brightness(1.4)}100%{opacity:0;transform:translateY(-60px) scale(1.4)}}
@keyframes outc{to{opacity:0;transform:translateY(40px) scale(.8)}}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;max-width:960px;width:100%;font-size:15px;line-height:1.6}
#stats>div{border:2px solid var(--stone);padding:10px 14px}#stats>div.act{border-color:var(--ember)}
#stats h3{margin:0 0 4px;font-weight:normal;color:var(--ember)}.cl{grid-column:1/-1}
@keyframes cin{0%{opacity:0;transform:translateY(40px) rotate(-6deg) scale(.85)}70%{transform:translateY(-6px) rotate(1deg) scale(1.03)}100%{opacity:1;transform:none}}
.card{animation:cin .5s cubic-bezier(.2,.8,.3,1) both;transition:transform .15s,box-shadow .15s}
.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.24s}
.card:hover{transform:translateY(-8px) scale(1.04);box-shadow:0 0 18px rgba(217,130,43,.5)}
@media(prefers-reduced-motion:reduce){.card,.reveal{animation:none}}

.it{border:2px solid var(--stone);padding:10px;font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:4px}

.reveal{max-width:420px;margin:20px auto;border:3px solid;padding:20px;text-align:center;animation:cin .6s both}
.sm{padding:2px 9px}
#coin{color:#e0c060}

.bar{position:absolute;top:6px;left:6px;right:6px;width:auto;max-width:none;gap:6px;z-index:6;pointer-events:none;align-items:center}
.bar>*{pointer-events:auto}.bar button{padding:3px 9px;font-size:12px;background:rgba(20,16,12,.82)}
.meter{display:none}#coin,#info{font-size:12px;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:3px}
#wrap:not(.ingame) .bar{display:none}
#ov{z-index:7}.menu{display:flex;flex-direction:column;gap:8px;min-width:250px}.menu button{font-size:18px;padding:10px 18px}
#pz{position:absolute;inset:0;background:rgba(10,8,6,.8);flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:8}
#wrap:fullscreen{max-width:none;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
#wrap:fullscreen canvas{width:auto;height:100vh;max-width:100vw;aspect-ratio:960/600;border:0}
.srow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;gap:10px}
.chestT{align-items:center;text-align:center}.buyrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
.price{color:#e0c060;font-weight:bold}.price.poor{color:#d06050}

#ov{background:radial-gradient(ellipse at 50% 42%,rgba(10,8,6,.25),rgba(6,4,3,.82) 78%)}
#ov h1{font-size:clamp(34px,8vw,70px);letter-spacing:.12em;text-transform:uppercase;font-weight:bold;background:linear-gradient(90deg,#8a5a2a,#ffd9a0,#d9822b,#ffd9a0,#8a5a2a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite,rise 1.1s both;filter:drop-shadow(0 0 14px rgba(217,130,43,.55))}

.xs{animation:swordsin 1.1s cubic-bezier(.2,1.4,.4,1) both,floaty 3.2s 1.1s infinite ease-in-out;filter:drop-shadow(0 0 14px #d9822b)}
.menu button{transition:transform .15s,box-shadow .15s,border-color .15s,background .15s;background:linear-gradient(#2e2620,#1a1410)}
#ov .menu button{animation:slidein .55s both}
#pz{animation:fadeq .12s both}@keyframes fadeq{from{opacity:0}to{opacity:1}}
#mhint{font-size:12px;color:#c8b08a;animation:fadeup .9s 1.4s both,hintp 2s 2.4s infinite}@keyframes hintp{0%,100%{opacity:.55}50%{opacity:1}}
#ov .menu button:nth-child(1){animation-delay:.9s}#ov .menu button:nth-child(6){animation-delay:1.4s}#ov .menu button:nth-child(7){animation-delay:1.5s}#ov .menu button:nth-child(2){animation-delay:1s}#ov .menu button:nth-child(3){animation-delay:1.1s}#ov .menu button:nth-child(4){animation-delay:1.2s}#ov .menu button:nth-child(5){animation-delay:1.3s}
.menu button:hover{transform:translateX(6px) scale(1.04);border-color:var(--ember);box-shadow:0 0 20px rgba(217,130,43,.65);background:linear-gradient(#4a3420,#2a1c10)}
#go{font-size:22px!important;border-color:var(--ember)!important;color:#ffd9a0;animation:slidein .55s .9s both,glowp 2.2s 1.6s infinite!important}
@keyframes shine{to{background-position:300% 0}}
@keyframes rise{from{opacity:0;transform:translateY(-34px) scale(.9);letter-spacing:.45em}to{opacity:1}}

#trn{position:absolute;top:44px;left:6px;width:300px;max-height:calc(100% - 140px);overflow:auto;background:linear-gradient(#17120e,#0c0906);border:1px solid #4a3a2a;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.65);z-index:7;font-size:12px}

.tf{display:flex;gap:6px;padding:8px 10px}.tf button{flex:1;border-radius:6px;padding:5px;font-size:12px}.exitb{border-color:#a8322a!important;color:#ffb0a0}

.pkr{display:grid;grid-template-columns:82px 1fr;gap:8px;align-items:center;margin-top:5px}
.pk{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;padding:5px 8px!important;border-radius:6px!important;background:#241c14!important;border:1px solid #5a4a3a!important;font-size:12px!important;width:100%}

.tb1{margin-top:5px}.tb1 button{width:100%;padding:5px;font-size:11px;border-radius:5px;background:#2a2218;border:1px solid #5a4a3a}.tb1 button:hover{border-color:#d9822b;background:#3a2c1c}
#mob{display:none;position:absolute;inset:0;z-index:5;pointer-events:none;touch-action:none;--ms:1}

.stk{position:absolute;bottom:calc(26px*var(--ms));width:calc(116px*var(--ms));height:calc(116px*var(--ms));border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.05),rgba(255,255,255,.16));border:2px solid rgba(255,255,255,.38);pointer-events:auto;touch-action:none}
